<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cougar Count — FLC</title>
<meta name="description" content="How busy the Fitness &amp; Lifestyle Centre is right now.">
<meta name="theme-color" content="#12151a">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="quiet">

  <main>
    <p class="place">Fitness &amp; Lifestyle Centre</p>

    <p id="count" class="count">—</p>
    <p id="word" class="word"></p>
    <p id="detail" class="detail"></p>

    <div class="bar" role="img" aria-label="How full the gym is">
      <div id="fill" class="fill"></div>

    <p class="who">A student project by Eildvin Logrono and Aaron Borja.</p>
  </footer>

<script src="app.js"></script>
