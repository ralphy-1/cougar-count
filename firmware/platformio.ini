; Two environments, one per door. Which door a board is depends on which
; environment it was flashed with, never on editing a file first -- that is how
; a board ends up running the wrong door and the count drifts all week.
;
;   pio run -e door_in  -t upload
;   pio run -e door_out -t upload

[env]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
lib_deps      = bblanchon/ArduinoJson@^7.0.0

[env:door_in]
build_flags = -D DEVICE_IS_ENTRANCE

[env:door_out]
build_flags = -D DEVICE_IS_EXIT
